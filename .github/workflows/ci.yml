name: HeatShield CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Run backend tests
        run: pytest -q

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/heatshield
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/heatshield/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint operational product slice
        run: >-
          npx eslint
          src/api/decisionIntelligenceApi.js
          src/api/sitePlanApi.js
          src/components/map/GoogleSiteMap.jsx
          src/product/mobile/SiteSetupScreen.jsx
          src/product/mobile/CrewSetupScreen.jsx
          src/product/mobile/DecisionComparisonStrip.jsx
          src/product/mobile/DecisionTwinMap.jsx
          src/product/mobile/DecisionWorkbench.jsx
          src/product/mobile/MapScreen.jsx
          src/product/mobile/PlanMapEditor.jsx
          src/product/mobile/PlanScreen.jsx
          src/product/mobile/SiteResiliencePanel.jsx
          src/product/mobile/TodayScreen.jsx
          src/product/mobile/operationalPlanState.js
          src/product/mobile/planWorkspace.js
      - name: Build complete frontend
        run: npm run build
